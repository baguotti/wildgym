<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wild Island Gym</title>
  <meta name="description" content="Wild Island Gym Booking">
  
  <!-- Sans-Serif Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23222'/><text x='50%' y='69%' font-size='56' text-anchor='middle' fill='%23fff' font-family='sans-serif' font-weight='bold'>W</text></svg>">
</head>
<body>
  <div id="app" class="app-container">
    <!-- Compact Top Bar -->
    <header class="app-header">
      <div class="brand">
        <img src="assets/img/logo.png" alt="Gym" class="brand-logo-img">
      </div>

      <div class="header-right">
        <!-- Member Select -->
        <div class="member-select-wrap">
          <select id="active-member-select" title="Active member">
            <option value="" disabled selected>Loading...</option>
          </select>
        </div>

        <!-- Rules Button -->
        <button id="btn-rules" class="btn btn-sm" title="Gym Rules">Rules</button>

        <!-- Roster Button -->
        <button id="btn-manage-members" class="btn btn-sm" title="Manage Roster">Roster</button>

        <!-- Theme Toggle -->
        <button id="btn-theme-toggle" class="btn-icon" title="Theme" aria-label="Toggle Theme">
          <span id="theme-icon">◐</span>
        </button>
      </div>
    </header>

    <!-- Main Navigation Bar -->
    <div class="nav-bar">
      <div class="nav-arrows">
        <button id="btn-prev-week" class="btn btn-sm" title="Previous Week">&larr;</button>
        <button id="btn-today" class="btn btn-sm" title="Today">Today</button>
        <button id="btn-next-week" class="btn btn-sm" title="Next Week">&rarr;</button>
      </div>

      <div class="nav-title-wrap">
        <span id="current-week-label" class="nav-week-title">Aug 18 – 24, 2026</span>
        <span id="my-bookings-count-badge" class="my-count-pill">
          <span id="my-bookings-text">0 booked</span>
        </span>
      </div>
    </div>

    <!-- Mobile Day Tabs -->
    <nav class="mobile-day-tabs" id="mobile-day-tabs" aria-label="Select Day"></nav>

    <!-- Compact Calendar Grid Viewport -->
    <main class="calendar-viewport">
      <div id="calendar-grid" class="calendar-grid">
        <div class="calendar-loading">
          <p>Loading schedule...</p>
        </div>
      </div>
    </main>

    <!-- Compact Roster Modal -->
    <div id="members-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
      <div class="modal-card">
        <div class="modal-header">
          <h3>Roster (<span id="members-count">0</span>)</h3>
          <button id="btn-close-modal" class="btn-close" aria-label="Close">&times;</button>
        </div>

        <div class="modal-body">
          <form id="form-add-member" class="add-form">
            <input type="text" id="input-member-name" placeholder="Name" required maxlength="50" autocomplete="off">
            <input type="email" id="input-member-email" placeholder="Email (optional)" maxlength="60">
            <button type="submit" class="btn btn-solid">Add</button>
          </form>

          <div id="members-list" class="members-list">
            <!-- Dynamically populated -->
          </div>
        </div>
      </div>
    </div>

    <!-- Gym Rules Modal -->
    <div id="rules-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
      <div class="modal-card rules-card">
        <div class="modal-header">
          <h3>Gym Rules & Guidelines</h3>
          <div class="modal-header-actions">
            <button id="btn-edit-rules" class="btn btn-sm" title="Edit Rules">Edit</button>
            <button id="btn-close-rules-modal" class="btn-close" aria-label="Close">&times;</button>
          </div>
        </div>

        <div class="modal-body rules-body">
          <!-- View Mode -->
          <div id="rules-view-container">
            <div id="rules-list" class="rules-list">
              <!-- Dynamically populated -->
            </div>
          </div>

          <!-- Edit Mode -->
          <div id="rules-edit-container" class="hidden">
            <div id="rules-edit-list" class="rules-edit-list">
              <!-- Dynamically populated edit rows -->
            </div>
            <div class="rules-edit-toolbar">
              <button id="btn-add-rule-row" class="btn btn-sm" type="button">+ Add Rule</button>
              <div class="rules-edit-actions">
                <button id="btn-cancel-rules-edit" class="btn btn-sm" type="button">Cancel</button>
                <button id="btn-save-rules" class="btn btn-sm btn-solid" type="button">Save</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
